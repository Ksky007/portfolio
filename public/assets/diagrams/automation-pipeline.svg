<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <style>
      .bg { fill: #121925; stroke: rgba(255,255,255,0.10); stroke-width: 2; }
      .t  { fill: #e6edf3; font: 600 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .s  { fill: #9fb0c0; font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .a  { stroke: rgba(255,255,255,0.18); stroke-width: 2; marker-end: url(#arrow); }
      .chip { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="rgba(255,255,255,0.25)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="45" class="t">Automation Validation Pipeline</text>
  <text x="30" y="72" class="s">Source of Truth → Generate → Provision/Deploy → Validate Traffic → Report/Debug</text>

  <!-- Boxes -->
  <rect x="30"  y="110" width="200" height="150" rx="18" class="bg"/>
  <rect x="260" y="110" width="200" height="150" rx="18" class="bg"/>
  <rect x="490" y="110" width="220" height="150" rx="18" class="bg"/>
  <rect x="740" y="110" width="220" height="150" rx="18" class="bg"/>
  <rect x="990" y="110" width="180" height="150" rx="18" class="bg"/>

  <!-- Box Titles -->
  <text x="55"  y="150" class="t">Source of Truth</text>
  <text x="285" y="150" class="t">Config Generator</text>
  <text x="515" y="150" class="t">Provision / Deploy</text>
  <text x="765" y="150" class="t">Traffic Validation</text>
  <text x="1015" y="150" class="t">Reports</text>

  <!-- Box Subtext -->
  <text x="55"  y="180" class="s">YAML / JSON</text>
  <text x="55"  y="204" class="s">device + test intent</text>

  <text x="285" y="180" class="s">Jinja2 templates</text>
  <text x="285" y="204" class="s">render configs at scale</text>

  <text x="515" y="180" class="s">Ansible / NDFC</text>
  <text x="515" y="204" class="s">deploy + health checks</text>

  <text x="765" y="180" class="s">Ixia traffic</text>
  <text x="765" y="204" class="s">HA / convergence tests</text>

  <text x="1015" y="180" class="s">Artifacts + logs</text>
  <text x="1015" y="204" class="s">debug quickly</text>

  <!-- Chips -->
  <rect x="55" y="228" width="140" height="26" rx="13" class="chip"/>
  <text x="68" y="247" class="s">Git versioned</text>

  <rect x="285" y="228" width="160" height="26" rx="13" class="chip"/>
  <text x="298" y="247" class="s">Data-driven</text>

  <rect x="515" y="228" width="180" height="26" rx="13" class="chip"/>
  <text x="528" y="247" class="s">Reproducible runs</text>

  <rect x="765" y="228" width="180" height="26" rx="13" class="chip"/>
  <text x="778" y="247" class="s">Deterministic checks</text>

  <rect x="1015" y="228" width="140" height="26" rx="13" class="chip"/>
  <text x="1028" y="247" class="s">Traceability</text>

  <!-- Arrows -->
  <line x1="230" y1="185" x2="260" y2="185" class="a"/>
  <line x1="460" y1="185" x2="490" y2="185" class="a"/>
  <line x1="710" y1="185" x2="740" y2="185" class="a"/>
  <line x1="960" y1="185" x2="990" y2="185" class="a"/>
</svg>
